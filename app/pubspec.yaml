name: app
description: "SinglePana Flutter client (parity with React frontend)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  intl: ^0.20.2
  flutter_svg: ^2.2.4
  image_picker: ^1.2.1
  share_plus: ^12.0.1
